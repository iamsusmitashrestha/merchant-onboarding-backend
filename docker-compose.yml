# Local development only. Credentials come from .env (copy .env.example) — none are hard-coded here.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: merchant-onboarding-api:local
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # production mode turns Swagger off by default; keep it on for this local stack
      SWAGGER_ENABLED: 'true'
      # inside the compose network the services listen on their default ports
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # explicit, ordered startup: migrations → idempotent fake demo users → app (the app never auto-migrates)
    command: sh -c "npx typeorm migration:run -d dist/database/data-source.js && node dist/database/seeds/seed.js && node dist/main"

volumes:
  pgdata:
